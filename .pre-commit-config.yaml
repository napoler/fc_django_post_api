repos:
  - repo: local
    hooks:
      - id: verify-dist-build
        name: Verify dist build has OutstandingToken fix
        entry: python3 tools/verify_build.py
        language: system
        pass_filenames: false
        files: ^(src/fc_django_post_api/admin_site\.py|pyproject\.toml)$
        stages: [pre-commit]
